set-option -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

bind-key -r Space next-layout

set -g mouse on
set -w mode-keys vi

set -g base-index 1
setw -g pane-base-index 1


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'vaaleyard/tmux-dotbar'
# Tokyo Night (night) palette for the minimal dotbar
set -g @tmux-dotbar-bg '#1a1b26'
set -g @tmux-dotbar-fg '#565f89'
set -g @tmux-dotbar-fg-current '#c0caf5'
set -g @tmux-dotbar-fg-session '#7aa2f7'
set -g @tmux-dotbar-fg-prefix '#bb9af7'


set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set-option -g status-position top

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
