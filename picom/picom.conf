# picom.conf - X11 compositor, started from i3 (see i3/config).
# Transparency in kitty (background_opacity) only works with a compositor.
#
# Reload after editing:  pkill -USR1 picom

backend = "glx";
vsync = true;

# Rounded corners for every window (drawn by picom).
# Set to 0 to disable. Very large radii + transparency can look odd.
corner-radius = 8;
rounded-corners-exclude = [
    "fullscreen",
];

# Shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'i3bar'",
    "name = 'Notification'",
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# Kitchen-sink fix: keep things smooth when a window is fullscreen
unredir-if-possible = true;
unredir-if-possible-delay = 300;

# Make the i3bar slightly translucent. kitty handles its own opacity via
# background_opacity, so it is deliberately not listed here.
opacity-rule = [
    "99:class_g = 'i3bar'",
];

# Optional: blur whatever is behind translucent windows. Needs a working GLX
# backend and a GPU with some headroom; uncomment all four lines to enable.
#blur-background = true;
#blur-method = "dual_kawase";
#blur-strength = 5;
#blur-background-frame = false;
