# vim:ft=kitty
## name: Tokyo Night (Night, washed)
## author: Folke Lemaitre (palette), washed to soften the accents
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_night.conf

# Basic colors
foreground           #abb1ce
background           #1a1b26
selection_foreground #c2caec
selection_background #2b344f

# Cursor colors
cursor            #c2caec
cursor_text_color #1a1b24

# URL underline color when hovering with mouse
url_color #85d5c8

# Window border colors and terminal bell colors
active_border_color   #82a1e4
inactive_border_color #2a2e3e
bell_border_color     #8cccf1
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #16161c
active_tab_background   #82a1e4
inactive_tab_foreground #565c77
inactive_tab_background #2a2e3e
tab_bar_background      #15161c
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #1a1b24
mark1_background #82a1e4
mark2_foreground #1a1b24
mark2_background #e17c8f
mark3_foreground #1a1b24
mark3_background #d6b079

# The basic 16 colors
# black
color0 #15161c
color8 #434861

# red
color1 #e17c8f
color9 #eb8f9e

# green
color2  #a5ca7c
color10 #a8da61

# yellow
color3  #d6b079
color11 #edbb64

# blue
color4  #82a1e4
color12 #94b0ed

# magenta
color5  #b79de6
color13 #c3acef

# cyan
color6  #8cccf1
color14 #aed8f5

# white
color7  #abb1ce
color15 #c2caec
