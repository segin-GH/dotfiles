<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Use the terminal font (Maple Mono NF) as the system default everywhere. -->
<fontconfig>
    <alias>
        <family>sans-serif</family>
        <prefer><family>Maple Mono NF</family></prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer><family>Maple Mono NF</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>Maple Mono NF</family></prefer>
    </alias>
    <alias>
        <family>system-ui</family>
        <prefer><family>Maple Mono NF</family></prefer>
    </alias>
</fontconfig>
